# ==============================================================================
# Firmware Release Tracker - Model Configuration
# ==============================================================================
# Cấu hình danh sách các dòng sản phẩm cần theo dõi firmware được chia theo hãng.
# Bạn có thể bật (enabled: true) hoặc tắt (enabled: false) từng model.

# ------------------------------------------------------------------------------
# 1. DRAYTEK ROUTER & ACCESS POINT
# ------------------------------------------------------------------------------
# Đường dẫn URL chuẩn thường có dạng: https://fw.draytek.com.tw/<Tên_Model>/Firmware/
draytek:
  - id: "vigor2926"
    name: "DrayTek Vigor 2926 Series"
    url: "https://fw.draytek.com.tw/Vigor2926/Firmware/"
    enabled: true

# ------------------------------------------------------------------------------
# 2. HIKVISION DVR, NVR & IPC
# ------------------------------------------------------------------------------
# Tự động đồng bộ từ cổng Firmware Catalog của Hikvision.
# region: "Asia" (mặc định cho thị trường VN) hoặc "Europe"
hikvision:
  - id: "7208hqhi-m1-e"
    name: "Hikvision iDS-7208HQHI-M1/E"
    region: "Asia"
    enabled: true

  - id: "ds-2cd1043g2-liuf"
    name: "Hikvision DS-2CD1043G2-LIUF"
    region: "Asia"
    enabled: true

# ------------------------------------------------------------------------------
# 3. TP-LINK ROUTER & DECO MESH
# ------------------------------------------------------------------------------
# Đường dẫn download chuẩn: https://www.tp-link.com/en/support/download/<model>/
# hoặc có thể chỉ định cụ thể Hardware Version: .../<model>/v1/
tplink:
  - id: "deco-m4-v1"
    name: "TP-Link Deco M4 (V1)"
    url: "https://www.tp-link.com/vn/support/download/deco-m4/v1/"
    enabled: true

  - id: "deco-x60-v3.2"
    name: "TP-Link Deco X60 (V3.2)"
    url: "https://www.tp-link.com/vn/support/download/deco-x60/v3.20/"
    enabled: true

  - id: "archer-c50-v3"
    name: "TP-Link Archer C50 (V3)"
    url: "https://www.tp-link.com/vn/support/download/archer-c50/v3/"
    enabled: true

  - id: "archer-c20-v4"
    name: "TP-Link Archer C20 (V4)"
    url: "https://www.tp-link.com/vn/support/download/archer-c20/v4/"
    enabled: true
