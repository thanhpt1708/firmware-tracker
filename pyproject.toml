[project]
name = "draytek-firmware-tracker"
version = "0.1.0"
description = "Automated DrayTek firmware release tracker and Telegram notifier"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx[http2]>=0.28.0",
    "pyyaml>=6.0.3",
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.2.0",
    "packaging>=26.0.0",
    "pydantic>=2.14.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-httpx>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

